# SentinelEdge local development environment (LOCAL provenance — no AWS resources).
#
# Topology mirrors the AWS design (docs/architecture.md):
#   browser -> web (edge stand-in, :8080) -> api -> db
#                                    migrate -> db   (one-shot, runs before api starts)
# - Only `web` and (for Vite dev) `api` are published, and only on 127.0.0.1.
# - `db` sits on an internal-only network: no published port, no outbound internet —
#   the local analogue of RDS in isolated subnets (ADR-0001).
# - Every container: non-root, read-only root filesystem, all Linux capabilities dropped,
#   no-new-privileges.
# - Secrets are scoped per container (ADR-0015): no service gets the whole .env file.
#   The API receives only the app role's password; only `migrate` receives the migrator's.

name: sentineledge

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped

x-app-config: &app-config
  SENTINEL_ENVIRONMENT: ${SENTINEL_ENVIRONMENT:-local}
  SENTINEL_LOG_LEVEL: ${SENTINEL_LOG_LEVEL:-INFO}
  SENTINEL_DB_HOST: db
  SENTINEL_DB_NAME: ${POSTGRES_DB:?set in .env}

services:
  db:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run `make env` to generate .env}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
      # Consumed once, by db/bootstrap-roles.sh during first initialisation.
      SENTINEL_DB_MIGRATOR_PASSWORD: ${SENTINEL_DB_MIGRATOR_PASSWORD:?.env predates Phase 2; see docs/local-development.md}
      SENTINEL_DB_APP_PASSWORD: ${SENTINEL_DB_APP_PASSWORD:?.env predates Phase 2; see docs/local-development.md}
    # Postgres needs a few capabilities during init to chown its data dir; it then drops
    # to the unprivileged `postgres` user.
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    tmpfs: [/tmp, /var/run/postgresql]
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/bootstrap-roles.sh:/docker-entrypoint-initdb.d/10-bootstrap-roles.sh:ro
    networks: [data]
    healthcheck:
      # TCP, not the Unix socket: during first-run initialisation Postgres listens only on the
      # socket, so a TCP check reports healthy only after the role bootstrap has finished.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    <<: *hardening
    build: ./backend
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    environment:
      <<: *app-config
      SENTINEL_DB_MIGRATOR_PASSWORD: ${SENTINEL_DB_MIGRATOR_PASSWORD:?.env predates Phase 2; see docs/local-development.md}
    tmpfs: [/tmp]
    depends_on:
      db:
        condition: service_healthy
    networks: [data]

  api:
    <<: *hardening
    build: ./backend
    environment:
      <<: *app-config
      SENTINEL_ENABLE_API_DOCS: ${SENTINEL_ENABLE_API_DOCS:-false}
      SENTINEL_TRUSTED_HOSTS: ${SENTINEL_TRUSTED_HOSTS:-localhost,127.0.0.1,api}
      # AI engine (Phase 9): disabled unless chosen. Only `bedrock` costs money; its bounds:
      SENTINEL_AI_PROVIDER: ${SENTINEL_AI_PROVIDER:-disabled}
      SENTINEL_AI_MODEL: ${SENTINEL_AI_MODEL:-us.amazon.nova-micro-v1:0}
      SENTINEL_AI_MAX_OUTPUT_TOKENS: ${SENTINEL_AI_MAX_OUTPUT_TOKENS:-800}
      SENTINEL_AI_REQUESTS_PER_USER_PER_DAY: ${SENTINEL_AI_REQUESTS_PER_USER_PER_DAY:-20}
      SENTINEL_AI_TOKENS_PER_DAY: ${SENTINEL_AI_TOKENS_PER_DAY:-200000}
      SENTINEL_AWS_REGION: ${SENTINEL_AWS_REGION:-us-east-2}
      SENTINEL_DB_PASSWORD: ${SENTINEL_DB_APP_PASSWORD:?.env predates Phase 2; see docs/local-development.md}
      SENTINEL_JWT_SIGNING_KEY: ${SENTINEL_JWT_SIGNING_KEY:?.env predates Phase 2; see docs/local-development.md}
      SENTINEL_MFA_ENCRYPTION_KEY: ${SENTINEL_MFA_ENCRYPTION_KEY:?.env predates Phase 2; see docs/local-development.md}
      SENTINEL_PUBLIC_ORIGINS: ${SENTINEL_PUBLIC_ORIGINS:-http://localhost:8080}
      # Trust X-Forwarded-For only from the edge network, where the web (nginx) container is
      # the only other member (T-ORG-02). nginx overwrites the header with the real client.
      SENTINEL_TRUSTED_PROXY_CIDRS: 172.30.86.0/24
    # Short-lived AWS session credentials for Bedrock, only if `make bedrock-credentials`
    # wrote them (git-ignored, mode 600). Without the file the API has no AWS credentials.
    env_file:
      - path: .env.bedrock
        required: false
    tmpfs: [/tmp]
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [edge, data]
    ports:
      - "127.0.0.1:8000:8000"

  web:
    <<: *hardening
    build: ./frontend
    tmpfs: [/tmp]
    depends_on: [api]
    networks: [edge]
    ports:
      - "127.0.0.1:8080:8080"

networks:
  edge:
    # Pinned so the API can trust exactly this proxy network for client IPs (no wildcard).
    ipam:
      config:
        - subnet: 172.30.86.0/24
  data:
    internal: true

volumes:
  db-data: {}
