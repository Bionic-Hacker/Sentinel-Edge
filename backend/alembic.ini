# Alembic configuration. There is intentionally NO sqlalchemy.url here: the migrator role's
# credentials come from SENTINEL_DB_* environment variables (alembic/env.py), never from a file.
[alembic]
script_location = %(here)s/alembic
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = os
