# Security runs before code ever leaves the laptop (ADR-0013). Mirrored by .github/workflows/ci.yml.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: detect-private-key
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: check-merge-conflict
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: no-commit-to-branch
        args: ["--branch", "main"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff
        args: ["--config", "backend/pyproject.toml"]
        files: ^backend/
      - id: ruff-format
        args: ["--config", "backend/pyproject.toml"]
        files: ^backend/

  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: ["-c", "backend/pyproject.toml", "-q"]
        files: ^backend/app/
        additional_dependencies: ["bandit[toml]"]

  - repo: local
    hooks:
      - id: eslint
        name: eslint (frontend security + a11y rules)
        entry: bash -c 'cd frontend && npx eslint --max-warnings=0 .'
        language: system
        files: ^frontend/src/
        pass_filenames: false
