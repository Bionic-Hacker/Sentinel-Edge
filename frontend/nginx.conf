# Local stand-in for the edge (CloudFront in Phase 5): serves the SPA and routes /api/* to the
# API container, giving the same single-origin topology as production (ADR-0002).
server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    client_max_body_size 1m;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # nginx's $request_id (32 hex chars) passes the API's correlation-ID allow-list.
        proxy_set_header X-Request-ID $request_id;
        # Overwrite, never append: nginx is the edge locally, so anything the client sent in
        # X-Forwarded-For is discarded and the API sees the real peer (T-ORG-02).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_redirect off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        # The API sets its own (stricter) security headers.
    }

    # An AI analysis waits for the model (Phase 9): the API bounds it (SENTINEL_AI_TIMEOUT_SECONDS,
    # one retry), so only this one endpoint gets a longer read timeout. Same headers as above.
    location = /api/v1/ai/analyses {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_redirect off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 75s;
    }

    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
